services:
  - type: web
    name: streamengagement
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: streamengagement-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_MODE
        value: cloud
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BRIDGE_TOKEN
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_PLAYLIST_ID
        sync: false
      - key: STREAMERBOT_WS_PASSWORD
        sync: false
      - key: STREAMERBOT_TIKTOK_REPLY_ACTION_ID
        sync: false
      - key: POLAROID_CAMERA_SOURCE
        value: camera
      - key: POLAROID_REWARD_TITLE
        value: Polaroid
      - key: POLAROID_DISCORD_WEBHOOK
        sync: false
      - key: POLAROID_TWITCH_CHAT_ENABLED
        value: "true"
      - key: POLAROID_TWITCH_CHAT_ACTION_NAME
        value: Post Polaroid Link
      - key: POLAROID_AVATAR_RESOLVER_ENABLED
        value: "true"
      - key: POLAROID_AVATAR_RESOLVER_ACTION_NAME
        value: Resolve Polaroid Avatar
      - key: SPOTIFY_CLEAN_ONLY
        value: "true"
      - key: SPOTIFY_QUEUE_ENABLED
        value: "true"
