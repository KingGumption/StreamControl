<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word Vault</title>
  <link rel="stylesheet" href="/assets/seasonal-theme.css">
  <link rel="stylesheet" href="/assets/word-vault.css">
  <script src="/assets/seasonal-theme.js" data-follow-graphics></script>
</head>
<body>
  <div class="scale">
    <main class="cabinet" hidden>
      <header class="mast">
        <div><p class="eyebrow" id="puzzle"></p><h1>Word Vault</h1></div>
        <div class="meter"><span class="eyebrow">Crew score</span><strong id="score">0</strong></div>
      </header>
      <section class="play">
        <div class="board-panel">
          <div class="receipt-title">Guess log</div>
          <div id="board" role="list" aria-label="Tried words and letter clues"></div>
          <div class="key"><span><b>✓</b> Exact</span><span><b>↔</b> Move</span><span><b>×</b> Out</span></div>
        </div>
        <div class="intel">
          <div class="reading"><span class="eyebrow" id="attempt"></span><strong id="clock"></strong></div>
          <h2 id="directive"></h2>
          <div class="combination" aria-label="Known letters"><div class="spindle" id="spindle"></div></div>
          <div class="slip">
            <p class="eyebrow" id="slip-label"></p>
            <strong id="signal"></strong>
            <p id="votes"></p>
          </div>
          <p id="hint"></p>
        </div>
      </section>
      <footer><strong id="command"></strong><span id="instruction"></span></footer>
    </main>
    <main class="decoder" hidden aria-label="Word Vault gameplay corner">
      <header class="decoder-top"><h1>Word Vault</h1><span id="decoder-round"></span><strong id="decoder-score"></strong></header>
      <div class="decoder-body">
        <section class="decoder-display">
          <h2 id="decoder-state"></h2>
          <div id="decoder-code" aria-label="Known letters"></div>
          <p id="decoder-ballot"></p>
        </section>
        <section class="decoder-log" aria-label="Previous guesses">
          <h2>Guess history</h2><div id="decoder-history" role="list"></div>
          <p class="decoder-legend"><b>✓</b> Exact <b>↔</b> Move <b>×</b> Out</p>
        </section>
      </div>
      <div id="decoder-clue" hidden></div>
      <div class="decoder-strip"><strong id="decoder-command"></strong><b id="decoder-clock"></b></div>
    </main>
  </div>
  <script src="/assets/word-vault.js"></script>
</body></html>
