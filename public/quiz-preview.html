<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz screen preview</title><style>*{box-sizing:border-box}body{margin:0;background:#101418;color:#edf4f7;font:16px Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:24px}nav,.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}a{color:#4ecdc4}nav a,button{padding:12px;border:1px solid #344454;border-radius:8px;text-decoration:none}button{background:#4ecdc4;color:#101418;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.panel{background:#181d25;border:1px solid #27313d;border-radius:12px;padding:24px;margin:20px 0}p{line-height:1.6;color:#b3c3cf}input{display:block;background:#101418;color:white;border:1px solid #344454;border-radius:6px;padding:10px;margin:10px 0 20px;width:100%}h1{font-size:2.2rem}h2{line-height:1.4}.option{padding:18px;background:#263342;border-radius:8px}.correct{background:#205f4f}#error{color:#ff9090}#status{color:#f4c95d;font-weight:bold}label{display:block}
.preview-shell{max-width:1200px;margin:auto;padding:20px}.preview-shell header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #27313d;margin-bottom:20px;padding-bottom:16px}.preview-shell header h1{font-size:1.8rem;margin:0}.preview-controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.preview-controls button{background:#1e2430;color:#edf4f7;border:1px solid #344454}.preview-controls button[aria-pressed=true]{border-color:#4ecdc4;background:#234943}.preview-notice{border-left:3px solid #4ecdc4;padding:12px 16px;background:#181d25}.preview-canvas{width:480px;max-width:100%;min-height:330px;margin:20px auto;background:repeating-conic-gradient(#293039 0% 25%,#20262e 0% 50%) 50% / 24px 24px;border:1px solid #344454;border-radius:12px;overflow:hidden}.preview-canvas .shell{padding:12px}.preview-canvas #eliminationSummary{font-size:.85rem}select{padding:9px;background:#181d25;color:#edf4f7;border:1px solid #344454;border-radius:6px}.preview-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.preview-tools label{display:inline}.preview-caption{text-align:center;color:#a2b5c3}
</style><link rel="stylesheet" href="/assets/quiz-results.css"></head><body><div class="preview-shell">
<header><h1>Quiz screen preview</h1><a href="/admin/quiz">Back to quiz controls</a></header>
<div class="preview-notice"><strong>Preview only - no analytics or wins are recorded.</strong><p>These are sample players and scores. This page uses the real overlay visuals without joining or controlling your live game.</p></div>
<div class="preview-controls" id="previewStates" aria-label="Preview state"></div>
<div class="preview-tools"><label>Overlay width <select id="previewWidth"><option value="420">420 px</option><option value="480" selected>480 px</option><option value="720">720 px</option><option value="1080">1080 px</option></select></label><button id="playSequence">Play reveal to winner</button></div>
<p id="previewDescription" class="preview-caption"></p><div id="previewCanvas" class="preview-canvas"><div id="overlayRoot" class="shell" hidden><h1>Elimination Quiz</h1><section id="quizStage" class="quiz-stage" hidden aria-live="polite"></section><section id="questionPanel" class="panel" aria-live="polite"><div id="status">Connecting...</div><p id="counts"></p><h2 id="question"></h2><div class="question-body"><div id="questionMedia" hidden></div><div class="grid" id="options"></div></div><p id="result"></p></section><p id="error" role="alert"></p></div></div>
<p id="cleanupStatus" class="preview-caption"></p></div>
<script>globalThis.QUIZ_PREVIEW = true;</script><script src="/assets/quiz-view.js"></script><script src="/assets/quiz-preview.js"></script></body></html>
