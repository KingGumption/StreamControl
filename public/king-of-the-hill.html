<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King of the Hill</title>
    <style>
      :root {
        --cyan: #62f4ef;
        --pink: #ff88ae;
        --gold: #ffd65a;
        --twitch: #9146ff;
        --youtube: #ff3040;
        --tiktok: #25f4ee;
        --glass: rgba(19, 22, 43, .88);
        --line: rgba(127, 239, 255, .4);
        --text: #fff;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { font-family: Inter, Arial, Helvetica, sans-serif; color: var(--text); }
      .stage { position: relative; width: 100%; height: 100%; }
      .game {
        position: absolute; left: 50%; bottom: 5.5%; width: min(1120px, 92vw); min-height: 360px;
        transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
        transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1);
      }
      .game.visible { opacity: 1; transform: translate(-50%, 0); }
      .glass {
        position: relative; padding: 25px 28px 28px; border: 2px solid var(--line); border-radius: 30px;
        background: linear-gradient(135deg, rgba(54,56,91,.93), var(--glass) 52%, rgba(31,25,62,.94));
        box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 35px rgba(77,230,244,.16), inset 0 1px rgba(255,255,255,.18);
        backdrop-filter: blur(22px); overflow: hidden;
      }
      .glass::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 20% 0, rgba(98,244,239,.15), transparent 28%), radial-gradient(circle at 80% 100%, rgba(255,93,179,.14), transparent 30%);
      }
      .topline { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
      .heading { min-width: 0; }
      .kicker { color: var(--cyan); font-size: 18px; font-weight: 900; letter-spacing: .17em; text-transform: uppercase; text-shadow: 0 0 14px rgba(98,244,239,.42); }
      h1 { margin: 5px 0 0; font-size: clamp(31px, 3.2vw, 48px); line-height: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .timer {
        display: flex; align-items: center; justify-content: center; min-width: 84px; height: 54px; padding: 0 16px;
        border-radius: 18px; background: rgba(7,10,24,.64); border: 1px solid rgba(255,255,255,.17);
        color: var(--gold); font-size: 28px; font-weight: 900; box-shadow: inset 0 0 15px rgba(0,0,0,.28);
      }
      .versus { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      .versus::after {
        content: "VS"; position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-7deg);
        display: grid; place-items: center; width: 62px; height: 62px; border-radius: 18px;
        color: #171326; background: linear-gradient(135deg, var(--gold), #ff9872); border: 3px solid #fff;
        font-size: 22px; font-weight: 1000; box-shadow: 0 8px 28px rgba(0,0,0,.45), 0 0 24px rgba(255,214,90,.35);
      }
      .choice {
        position: relative; display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 18px; align-items: center;
        min-width: 0; padding: 13px; border: 1px solid rgba(255,255,255,.14); border-radius: 23px;
        background: rgba(7,10,24,.5); box-shadow: inset 0 1px rgba(255,255,255,.08);
      }
      .choice.king { border-color: rgba(255,214,90,.55); box-shadow: inset 0 1px rgba(255,255,255,.08), 0 0 22px rgba(255,214,90,.11); }
      .art-wrap { position: relative; }
      .art { display: block; width: 170px; height: 112px; padding: 5px; object-fit: contain; border-radius: 16px; border: 2px solid rgba(255,255,255,.5); background: radial-gradient(circle at 50% 42%, rgba(83,92,137,.72), rgba(7,10,24,.9)); box-shadow: 0 8px 22px rgba(0,0,0,.42); }
      .number {
        position: absolute; left: -9px; top: -10px; display: grid; place-items: center; width: 47px; height: 47px;
        border-radius: 15px; color: #121528; background: linear-gradient(135deg, var(--cyan), #a7ffeb);
        border: 3px solid white; font-size: 27px; font-weight: 1000; box-shadow: 0 5px 16px rgba(0,0,0,.38), 0 0 18px rgba(98,244,239,.4);
      }
      .king-badge { position: absolute; right: -7px; top: -15px; font-size: 35px; filter: drop-shadow(0 4px 7px #000); transform: rotate(8deg); }
      .choice-copy { min-width: 0; }
      .choice-name { font-size: clamp(23px, 2.25vw, 34px); font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .vote-row { display: flex; align-items: end; justify-content: space-between; margin-top: 11px; color: #cfd2e3; font-size: 16px; font-weight: 700; }
      .percent { color: white; font-size: 27px; font-weight: 1000; }
      .bar { height: 12px; margin-top: 5px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.11); }
      .bar-fill { display: flex; width: 0; height: 100%; overflow: hidden; border-radius: inherit; transition: width .35s ease; }
      .platform-segment { height: 100%; min-width: 2px; box-shadow: inset -1px 0 rgba(255,255,255,.35); }
      .platform-breakdown { display: flex; flex-wrap: wrap; gap: 5px 11px; min-height: 19px; margin-top: 6px; color: #d9dbea; font-size: 12px; font-weight: 800; }
      .platform-stat, .platform-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      .platform-dot, .platform-swatch { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--platform-color, var(--gold)); box-shadow: 0 0 8px var(--platform-color, var(--gold)); }
      .platform-swatch.twitch { --platform-color: var(--twitch); }
      .platform-swatch.youtube { --platform-color: var(--youtube); }
      .platform-swatch.tiktok { --platform-color: var(--tiktok); }
      .footer { position: relative; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 7px 18px; margin-top: 15px; text-align: center; color: #e7e7f1; font-size: 18px; font-weight: 800; letter-spacing: .02em; }
      .footer strong { color: var(--cyan); font-size: 1.16em; }
      .platform-legend { display: inline-flex; gap: 12px; color: #cfd2e3; font-size: 13px; }
      .champion .topline { justify-content: center; text-align: center; }
      .champion .timer, .champion .versus::after, .champion .footer { display: none; }
      .champion .versus { display: block; width: min(590px, 90%); margin: 0 auto; }
      .champion .choice { grid-template-columns: 230px 1fr; padding: 16px; border-color: rgba(255,214,90,.7); }
      .champion .choice:not(:first-child) { display: none; }
      .champion .art { width: 230px; height: 151px; }
      .champion .number { display: none; }
      .champion .choice-name { font-size: 40px; }
      .champion .vote-row, .champion .bar, .champion .platform-breakdown { display: none; }
      .champion .king-badge { right: auto; left: 50%; top: -49px; font-size: 58px; transform: translateX(-50%); }
      @media (max-width: 820px) {
        .game { width: 94vw; bottom: 3%; min-height: 0; }
        .glass { padding: 18px; border-radius: 23px; }
        .kicker { font-size: 13px; }
        h1 { font-size: 28px; }
        .timer { min-width: 64px; height: 43px; font-size: 22px; }
        .versus { gap: 12px; }
        .choice { grid-template-columns: 1fr; gap: 8px; padding: 9px; }
        .art { width: 100%; height: auto; aspect-ratio: 1.52; }
        .choice-name { font-size: 20px; }
        .vote-row { font-size: 12px; margin-top: 6px; }
        .percent { font-size: 21px; }
        .footer { font-size: 14px; }
        .versus::after { width: 46px; height: 46px; font-size: 16px; border-radius: 13px; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="game" id="game" aria-live="polite">
        <div class="glass">
          <div class="topline">
            <div class="heading">
              <div class="kicker" id="kicker">Chat chooses the topic</div>
              <h1 id="title">King of the Hill</h1>
            </div>
            <div class="timer" id="timer">30</div>
          </div>
          <div class="versus" id="choices"></div>
          <div class="footer" id="footer">
            <span>Type <strong>1</strong> or <strong>2</strong> in chat · one vote each</span>
            <span class="platform-legend" aria-label="Vote colours">
              <span><i class="platform-swatch twitch"></i>Twitch</span>
              <span><i class="platform-swatch youtube"></i>YouTube</span>
              <span><i class="platform-swatch tiktok"></i>TikTok</span>
            </span>
          </div>
        </div>
      </section>
    </main>
    <script>
      const game = document.getElementById('game');
      const kicker = document.getElementById('kicker');
      const title = document.getElementById('title');
      const timer = document.getElementById('timer');
      const choices = document.getElementById('choices');
      const platformStyles = {
        twitch: { label: 'Twitch', color: '#9146ff', order: 0 },
        youtube: { label: 'YouTube', color: '#ff3040', order: 1 },
        tiktok: { label: 'TikTok', color: '#25f4ee', order: 2 },
      };
      let current = null;

      function render(state) {
        current = state;
        const visible = state.running && state.phase !== 'idle';
        game.classList.toggle('visible', visible);
        game.classList.toggle('champion', state.phase === 'champion');
        if (!visible) return;

        if (state.phase === 'topic') {
          kicker.textContent = 'Chat chooses the topic';
          title.textContent = 'What should battle next?';
        } else if (state.phase === 'battle') {
          kicker.textContent = `King of the Hill · Round ${state.round} of ${state.totalRounds}`;
          title.textContent = state.topic?.title || 'Choose your winner';
        } else {
          kicker.textContent = 'The crown has been claimed';
          title.textContent = `${state.topic?.title || 'King of the Hill'} Champion`;
        }

        choices.replaceChildren(...state.options.map((option) => choiceCard(option, state.phase)));
        updateTimer();
      }

      function choiceCard(option, phase) {
        const card = document.createElement('article');
        card.className = `choice${option.isKing || phase === 'champion' ? ' king' : ''}`;
        const artWrap = document.createElement('div');
        artWrap.className = 'art-wrap';
        const image = document.createElement('img');
        image.className = 'art';
        image.src = option.imageUrl;
        image.alt = '';
        artWrap.appendChild(image);
        const number = document.createElement('span');
        number.className = 'number';
        number.textContent = option.number;
        artWrap.appendChild(number);
        if (option.isKing || phase === 'champion') {
          const crown = document.createElement('span');
          crown.className = 'king-badge';
          crown.textContent = '👑';
          artWrap.appendChild(crown);
        }
        const copy = document.createElement('div');
        copy.className = 'choice-copy';
        const name = document.createElement('div');
        name.className = 'choice-name';
        name.textContent = option.title;
        const voteRow = document.createElement('div');
        voteRow.className = 'vote-row';
        const votes = document.createElement('span');
        votes.textContent = `${option.votes} vote${option.votes === 1 ? '' : 's'}`;
        const percent = document.createElement('span');
        percent.className = 'percent';
        percent.textContent = `${option.percent}%`;
        voteRow.append(votes, percent);
        const bar = document.createElement('div');
        bar.className = 'bar';
        const fill = document.createElement('span');
        fill.className = 'bar-fill';
        fill.style.width = `${option.percent}%`;
        const platformVotes = Object.entries(option.platformVotes || {})
          .filter(([, count]) => Number(count) > 0)
          .sort(([platformA], [platformB]) => platformStyle(platformA).order - platformStyle(platformB).order);
        platformVotes.forEach(([platform, count]) => {
          const style = platformStyle(platform);
          const segment = document.createElement('span');
          segment.className = 'platform-segment';
          segment.style.width = `${option.votes ? (Number(count) / option.votes) * 100 : 0}%`;
          segment.style.background = style.color;
          segment.title = `${style.label}: ${count}`;
          fill.appendChild(segment);
        });
        bar.appendChild(fill);
        const breakdown = document.createElement('div');
        breakdown.className = 'platform-breakdown';
        platformVotes.forEach(([platform, count]) => {
          const style = platformStyle(platform);
          const stat = document.createElement('span');
          stat.className = 'platform-stat';
          const dot = document.createElement('i');
          dot.className = 'platform-dot';
          dot.style.setProperty('--platform-color', style.color);
          stat.append(dot, `${style.label} ${count}`);
          breakdown.appendChild(stat);
        });
        copy.append(name, voteRow, bar, breakdown);
        card.append(artWrap, copy);
        return card;
      }

      function platformStyle(platform) {
        const key = String(platform || '').toLowerCase();
        return platformStyles[key] || { label: key || 'Other', color: '#ffd65a', order: 99 };
      }

      function updateTimer() {
        if (!current?.endsAt || current.phase === 'champion') {
          timer.textContent = '👑';
          return;
        }
        const remaining = Math.max(0, Math.ceil((new Date(current.endsAt).getTime() - Date.now()) / 1000));
        timer.textContent = remaining;
      }

      const events = new EventSource('/king-of-the-hill/events');
      events.addEventListener('hill-state', (event) => {
        try { render(JSON.parse(event.data)); } catch { /* wait for the next state */ }
      });
      setInterval(updateTimer, 250);
    </script>
  </body>
</html>
