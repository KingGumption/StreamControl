<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games</title><style>*{box-sizing:border-box}body{margin:0;background:#101418;color:#edf4f7;font:16px Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:24px}nav,.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}a{color:#4ecdc4}nav a,button{padding:12px;border:1px solid #344454;border-radius:8px;text-decoration:none}button{background:#4ecdc4;color:#101418;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.panel{background:#181d25;border:1px solid #27313d;border-radius:12px;padding:24px;margin:20px 0}p{line-height:1.6;color:#b3c3cf}input{display:block;background:#101418;color:white;border:1px solid #344454;border-radius:6px;padding:10px;margin:10px 0 20px;width:100%}h1{font-size:2.2rem}h2{line-height:1.4}.option{padding:18px;background:#263342;border-radius:8px}.correct{background:#205f4f}#error{color:#ff9090}#status{color:#f4c95d;font-weight:bold}label{display:block}</style><main class="shell"><nav aria-label="Admin pages"><a href="/admin">Song Requests</a><a href="/admin/games">Games</a><a href="/admin/king-of-the-hill">King of the Hill</a><a href="/admin/analytics">Analytics</a><a href="/admin/polaroid">Polaroid Redeem</a></nav><h1>Games</h1><p>Bring Twitch, YouTube and TikTok chat into the same game. Choose an experience to open its controls and stream overlay.</p><div id="games" class="grid"></div></main><script>const games=[{name:'King of the Hill',description:'Chat votes for challengers across themed battles. Configure rounds and timings.',href:'/admin/king-of-the-hill'},{name:'Elimination Quiz',description:'An increasingly difficult quiz. Join before the first question; one wrong or missed answer means elimination.',href:'/admin/quiz'}];for(const game of games){const card=document.createElement('article');card.className='panel';const title=document.createElement('h2');title.textContent=game.name;const description=document.createElement('p');description.textContent=game.description;const link=document.createElement('a');link.href=game.href;link.textContent='Open game controls ?';card.append(title,description,link);document.getElementById('games').append(card)}</script></html>
