<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gameplay corner</title>
<link rel="stylesheet" href="/assets/seasonal-theme.css"><link rel="stylesheet" href="/assets/arcade-corner.css">
<script data-follow-graphics src="/assets/seasonal-theme.js"></script></head>
<body><main hidden>
<section id="higher" aria-label="Higher or Lower" hidden>
  <header><h1>Higher <em>or</em> Lower</h1><b class="clock"></b></header>
  <div class="ticket">
    <div class="price"><small id="rank-label">Current rank</small><strong id="rank"></strong></div>
    <div class="form"><div id="run" aria-label="Recent ranks"></div><div class="calls"><span><kbd>1</kbd> ↑ Higher</span><span><kbd>2</kbd> ↓ Lower</span></div><b id="verdict"></b></div>
  </div><footer><span class="instruction"></span><span class="meta"></span></footer>
</section>
<section id="split" aria-label="Split the Crowd" hidden>
  <header><h1>Split the Crowd</h1><b class="clock"></b></header>
  <div class="lanes"><div class="lane"><i></i><kbd>1</kbd><strong></strong><span></span></div><div class="lane"><i></i><kbd>2</kbd><strong></strong><span></span></div></div>
  <footer><span class="instruction"></span><span class="meta"></span></footer>
</section>
<section id="number" aria-label="Secret Number Hunt" hidden>
 <div class="panel">
  <div class="matrix" aria-hidden="true"></div>
  <div class="readout"><header><h1>Number Hunt</h1><b class="clock"></b></header>
   <small id="scan-label"></small><strong id="frequency"></strong><span id="remaining"></span>
  </div>
 </div><footer><span class="instruction"></span><span class="meta"></span></footer>
</section>
</main><script src="/assets/arcade-corner.js"></script></body></html>
