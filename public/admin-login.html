<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamEngagement | Sign in</title>
<link rel="stylesheet" href="/assets/engagement-shell.css"><script defer src="/assets/engagement-shell.js"></script></head>
<body class="engagement-site">
  <main class="card access-signin">
    <h1>Sign in</h1>
    <p>Use your Stream Engagement account.</p>
    <div class="error" role="alert" id="error">Those sign-in details were not accepted.</div>
    <form method="post" action="/admin/login">
      <input type="hidden" name="returnTo" id="returnTo" value="/admin/dashboard">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <noscript><p><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p></noscript>
  </main>
  <script>const p=new URLSearchParams(location.search);document.getElementById('error').classList.toggle('show',p.has('error'));const r=p.get('returnTo');if(r&&r.startsWith('/admin'))document.getElementById('returnTo').value=r;</script>
</body>
</html>
