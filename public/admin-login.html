<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamEngagement | Sign in</title>
  <style>
    :root{color-scheme:dark;--bg:#090d14;--panel:#111824;--border:#26354a;--text:#f2f7fb;--muted:#8fa5b9;--teal:#4ee0ce}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0,rgba(78,224,206,.14),transparent 30rem),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.card{width:min(420px,100%);padding:30px;border:1px solid var(--border);border-radius:18px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.4)}.eyebrow{color:var(--teal);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:7px 0 6px;font-size:2rem}p{margin:0 0 24px;color:var(--muted)}label{display:block;margin-bottom:7px;font-weight:700}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#151f2d;color:var(--text);font:inherit}button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--teal);color:#071412;font:800 15px Inter,system-ui;cursor:pointer}.error{display:none;margin:0 0 16px;padding:10px;border:1px solid #743d48;border-radius:9px;background:#351b22;color:#ffb8c5}.error.show{display:block}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">StreamEngagement</div>
    <h1>Welcome back</h1>
    <p>Sign in to open your private stream controls and analytics.</p>
    <div class="error" id="error">That password was not accepted.</div>
    <form method="post" action="/admin/login">
      <input type="hidden" name="returnTo" id="returnTo" value="/admin">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Open StreamEngagement</button>
    </form>
  </main>
  <script>const p=new URLSearchParams(location.search);document.getElementById('error').classList.toggle('show',p.has('error'));const r=p.get('returnTo');if(r&&r.startsWith('/admin'))document.getElementById('returnTo').value=r;</script>
</body>
</html>
