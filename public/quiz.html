<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elimination Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#101418;color:#edf4f7;font:16px Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:24px}nav,.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}a{color:#4ecdc4}nav a,button{padding:12px;border:1px solid #344454;border-radius:8px;text-decoration:none}button{background:#4ecdc4;color:#101418;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.panel{background:#181d25;border:1px solid #27313d;border-radius:12px;padding:24px;margin:20px 0}p{line-height:1.6;color:#b3c3cf}input{display:block;background:#101418;color:white;border:1px solid #344454;border-radius:6px;padding:10px;margin:10px 0 20px;width:100%}h1{font-size:2.2rem}h2{line-height:1.4}.option{padding:18px;background:#263342;border-radius:8px}.correct{background:#205f4f}#error{color:#ff9090}#status{color:#f4c95d;font-weight:bold}label{display:block}</style><link rel="stylesheet" href="/assets/quiz-results.css"><main class="shell"><h1>Elimination Quiz</h1><section id="quizStage" class="quiz-stage" hidden aria-live="polite"></section><section class="panel" aria-live="polite"><div id="status">Connecting...</div><p id="counts"></p><h2 id="question"></h2><div class="grid" id="options"></div><p id="result"></p></section><p id="error" role="alert"></p></main><script src="/assets/quiz-view.js"></script><script></script></html>
