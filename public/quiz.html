<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elimination Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#101418;color:#edf4f7;font:16px Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:24px}nav,.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}a{color:#4ecdc4}nav a,button{padding:12px;border:1px solid #344454;border-radius:8px;text-decoration:none}button{background:#4ecdc4;color:#101418;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.panel{background:#181d25;border:1px solid #27313d;border-radius:12px;padding:24px;margin:20px 0}p{line-height:1.6;color:#b3c3cf}input{display:block;background:#101418;color:white;border:1px solid #344454;border-radius:6px;padding:10px;margin:10px 0 20px;width:100%}h1{font-size:2.2rem}h2{line-height:1.4}.option{padding:18px;background:#263342;border-radius:8px}.correct{background:#205f4f}#error{color:#ff9090}#status{color:#f4c95d;font-weight:bold}label{display:block}</style><main class="shell"><h1>Elimination Quiz</h1><section class="panel" aria-live="polite"><div id="status">Connecting?</div><p id="counts"></p><h2 id="question"></h2><div class="grid" id="options"></div><p id="result"></p></section><p id="error" role="alert"></p></main><script>let game;const $=id=>document.getElementById(id);function render(g){game=g;$('status').textContent=g.phase==='lobby'?'Lobby open ? type !quiz join in chat':g.phase==='question'?`Question ${g.round} of ${g.questionCount} ? Entries locked`:g.phase==='reveal'?'Answer revealed ? Entries locked':g.phase==='completed'?'Quiz complete':'Waiting for a quiz';$('counts').textContent=`${g.players} joined ? ${g.survivors} remaining`;$('question').textContent=g.question?.text||'Join before the host starts. Answer with !quiz A, !quiz B, !quiz C or !quiz D.';$('options').replaceChildren();(g.question?.options||[]).forEach((text,i)=>{const el=document.createElement('div');el.className='option'+(g.question.answer===i?' correct':'');el.textContent='ABCD'[i]+'. '+text;$('options').append(el)});$('result').textContent=g.phase==='completed'?(g.winners.length?'Winners: '+g.winners.map(p=>`${p.username} (${p.platform})`).join(', '):'Everyone was eliminated. No winners this time.'):'First answer is final. Wrong or missing answers eliminate you.';if($('open')){$('open').disabled=['lobby','question','reveal'].includes(g.phase);$('next').disabled=!['lobby','question','reveal'].includes(g.phase);$('next').textContent=g.phase==='question'?'Close answers & reveal':g.phase==='lobby'?'Lock entries & start':'Next question';$('questionCount').max=g.maxQuestions;}}async function refresh(){try{const r=await fetch('/quiz/state',{cache:'no-store'});if(!r.ok)throw Error('Unable to load quiz');render((await r.json()).game);}catch(e){$('error').textContent=e.message}}setInterval(refresh,1000);setInterval(()=>{if(game?.phase==='question')$('status').textContent=`Question ${game.round} of ${game.questionCount} ? ${Math.max(0,Math.ceil((game.deadline-Date.now())/1000))}s ? Entries locked`;},250);refresh();</script></html>
